# k8s/agent-core.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-core
  namespace: infra-brain
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-core
  template:
    metadata:
      labels:
        app: agent-core
    spec:
      initContainers:
        - name: bws-bootstrap
          image: ${CI_REGISTRY_IMAGE:-infra-brain}:${IMAGE_TAG:-latest}
          command: ["/bin/bash", "scripts/bws_bootstrap.sh"]
          env:
            - name: BWS_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bws-access-token
                  key: BWS_ACCESS_TOKEN
            - name: SECRETS_OUT
              value: /run/secrets/env
          volumeMounts:
            - name: secrets-vol
              mountPath: /run/secrets
      containers:
        - name: agent-core
          image: ${CI_REGISTRY_IMAGE:-infra-brain}:${IMAGE_TAG:-latest}
          command: ["/bin/bash", "-c", "source /run/secrets/env && python -m uvicorn infra_brain.main:create_app --factory --host 0.0.0.0 --port 8000"]
          envFrom:
            - configMapRef:
                name: infra-brain-config
          volumeMounts:
            - name: secrets-vol
              mountPath: /run/secrets
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
      volumes:
        - name: secrets-vol
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-core
  namespace: infra-brain
spec:
  selector:
    app: agent-core
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent-core-hpa
  namespace: infra-brain
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agent-core
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agent-core-pdb
  namespace: infra-brain
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: agent-core
