[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infra-brain"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3",
    "langgraph>=1.2,<2",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.2",
    "langchain-text-splitters>=0.3",
    "pgvector>=0.3",
    "langgraph-checkpoint-postgres>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.0",
    "apscheduler>=3.10",
    "redis>=5.0",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "sqlglot>=26.0",
    "ansible-runner>=2.3",
    "deepdiff>=7.0",
    "bcrypt>=4.0",
    "itsdangerous>=2.0",
    "fastmcp>=2.0",
    "docker>=7.0",
    "langfuse>=3.8,<5",
    "strawberry-graphql[fastapi]>=0.240",
    "cryptography>=42.0",
]

[project.optional-dependencies]
vsphere = [
    "pyVmomi>=8.0",
]
iac = [
    "python-hcl2>=4.0",
]
secrets = [
    "bitwarden-sdk>=1.0",
]
net = [
    "pysnmp>=6.0",
]
bedrock = [
    "langchain-aws>=0.2",
    "boto3>=1.34",
]
openai = [
    "langchain-openai>=0.2",
]
inventory = [
    "ruamel.yaml>=0.18",
]
winrm = [
    "pywinrm>=0.4",
]
dns = [
    "dnspython>=2.6",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "pytest-xdist>=3.6",
    "ruff==0.15.18",
    "playwright>=1.44",
]
all = [
    "infra-brain[vsphere,iac,secrets,net,bedrock,openai,winrm,dns]",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "postgres: requires TEST_DATABASE_URL (a real Postgres) -- self-skips when unset, this marker is for filtering/organization, not the skip mechanism itself",
    "slow: individually slow even without a real DB (subprocess, sleep-based timing, or heavy fixture setup) -- excluded by the fast dev-loop invocation, still runs in the default full suite",
]

[project.scripts]
infra-brain-scheduler = "infra_brain.scheduler:run_scheduler_forever"

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# dashboard_api.py uses star-imports from api/schemas.py and api/_helpers.py
# (re-export shim pattern — Phase 3 god-file split). F405 is expected here.
"src/infra_brain/dashboard_api.py" = ["E402", "F401", "F403", "F405"]
